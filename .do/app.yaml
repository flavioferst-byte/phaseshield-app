name: phaseshield-app
region: nyc
services:
- name: web
  dockerfile_path: Dockerfile
  source_dir: /
  github:
    repo: groupnuvion-sketch/phaseshield-app
    branch: main
    deploy_on_push: true
  http_port: 5000
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /
  health_check:
    http_path: /
    initial_delay_seconds: 30
    period_seconds: 10
    timeout_seconds: 5
    success_threshold: 1
    failure_threshold: 3
  envs:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "5000"
